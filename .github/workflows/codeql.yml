on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "27 4 * * 1"

name: CodeQL

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The plugin is an old-style WPF .csproj, so C# is traced through a real MSBuild build:
          # build-mode none cannot see the XAML-generated .g.cs partials.
          - language: csharp
            build-mode: manual
            runner: windows-2022
          # These workflows hold release, Sentry and Anthropic secrets.
          - language: actions
            build-mode: none
            runner: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Setup .NET SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        if: matrix.language == 'csharp'
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: NuGet Restore
        if: matrix.language == 'csharp'
        shell: pwsh
        run: nuget restore .\GsPlugin.sln

      - name: Build Entire Solution (.NET Framework 4.6.2)
        if: matrix.language == 'csharp'
        shell: pwsh
        run: msbuild $Env:GITHUB_WORKSPACE\GsPlugin.sln -p:Configuration=Release -p:UseSharedCompilation=false -restore -clp:ErrorsOnly

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
