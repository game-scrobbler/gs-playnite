on:
  push:
    branches: ["playnite11"]
  pull_request:
    branches: ["playnite11"]

name: Release Build (Playnite 11)

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # scripts/update-installer-manifest.Tests.ps1 parses its output with the real YAML
      # parser rather than a stub, and looks for the module at the repository root.
      # Without this the Pester step below fails before it runs a single manifest test.
      - name: Checkout powershell-yaml
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: cloudbase/powershell-yaml
          ref: 9664752e6f0149fd95a769e5788e0c84f75bd99e # pin to immutable commit
          path: powershell-yaml

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore GsPlugin.sln

      - name: Verify Formatting
        run: dotnet format GsPlugin.sln --verify-no-changes

      - name: Build
        run: dotnet build GsPlugin.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test GsPlugin.Tests/GsPlugin.Tests.csproj --configuration Release --no-build --verbosity normal

      # scripts/update-installer-manifest.ps1 and scripts/generate-release-highlights.ps1 drive the
      # release pipeline: the manifest Playnite reads for update discovery, and the user-facing
      # changelog. Both ship Pester suites that no workflow was running, so a break in either could
      # only be found in production. Pester is version-pinned so a gallery release cannot change
      # what CI enforces.
      - name: Run PowerShell Script Tests (Pester)
        run: |
          Install-Module Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser
          Import-Module Pester -RequiredVersion 5.6.1
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'scripts'
          $cfg.Run.Exit = $true
          $cfg.Output.CIFormat = 'GithubActions'
          Invoke-Pester -Configuration $cfg

      # Toolbox is vendored at tools/playnite-toolbox because Playnite 11 ships on the devel
      # channel and is not published as a GitHub release asset - the download the Playnite 10
      # pipeline used 404s for every 11.x version. See that folder's README for provenance.
      #
      # Do not replace this with Compress-Archive: Toolbox omits the assemblies Playnite itself
      # ships (Playnite.SDK.dll, ByteAether.Ulid.dll, CommunityToolkit.Mvvm.dll), and a plain zip
      # of bin\Release would ship those and reintroduce the host/extension version skew.
      - name: Verify vendored Toolbox
        run: |
          $exe = Join-Path $Env:GITHUB_WORKSPACE "tools\playnite-toolbox\Toolbox.exe"
          $expected = "D551A59AA3B122CC6B04874F643BA26BFBEBCD68424E5CAEBCD4A3B405348D9F"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
          if ($actual -ne $expected) { throw "Vendored Toolbox.exe hash $actual != expected $expected" }
          Write-Host "Vendored Toolbox.exe verified ($actual)"

      - name: Pack with Playnite Toolbox
        id: pack
        run: |
          mkdir "PackingOutput"
          # Toolbox's own help calls the second argument a destination directory, but it opens it
          # as a file: passing a directory fails with UnauthorizedAccessException. Name the .pext2
          # here instead of packing first and renaming afterwards.
          $name = "GsPlugin_" + "${{ github.ref_name }}".Replace("/", "_") + ".pext2"
          & "$Env:GITHUB_WORKSPACE\tools\playnite-toolbox\Toolbox.exe" pack "$Env:GITHUB_WORKSPACE\bin\Release\net10.0-windows" "$Env:GITHUB_WORKSPACE\PackingOutput\$name"
          if (-not (Test-Path "$Env:GITHUB_WORKSPACE\PackingOutput\$name")) { throw "Toolbox did not produce $name" }
          Move-Item -Path "$Env:GITHUB_WORKSPACE\PackingOutput\$name" -Destination $Env:GITHUB_WORKSPACE

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/playnite11'
        id: release
        uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Create Sentry Release
        if: ${{ steps.release.outputs.release_created }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: game-scrobbler
          SENTRY_PROJECT: gs-playnite
        run: |
          npm install -g @sentry/cli@2.42.2
          $assemblyVersion = [System.Reflection.AssemblyName]::GetAssemblyName("$Env:GITHUB_WORKSPACE\bin\Release\net10.0-windows\GsPlugin.dll").Version
          $version = $assemblyVersion.ToString(3)
          if ("${{ steps.release.outputs.tag_name }}" -ne "GsPlugin-v$version") {
            throw "Release tag does not match the built plugin version $version"
          }
          $pdb = [System.IO.File]::ReadAllBytes("$Env:GITHUB_WORKSPACE\bin\Release\net10.0-windows\GsPlugin.pdb")
          if ($pdb.Length -lt 4 -or [System.Text.Encoding]::ASCII.GetString($pdb, 0, 4) -ne 'BSJB') {
            throw 'The plugin PDB must use the portable format expected by the symbol upload'
          }
          sentry-cli releases new "GsPlugin@$version"
          sentry-cli releases set-commits "GsPlugin@$version" --auto
          sentry-cli upload-dif --type=portablepdb "$Env:GITHUB_WORKSPACE\bin\Release\net10.0-windows" --log-level=info
          sentry-cli releases finalize "GsPlugin@$version"

      - name: Rename Packed File to Release Tag
        if: ${{ steps.release.outputs.release_created }}
        run: |
          Get-ChildItem "$Env:GITHUB_WORKSPACE" -Filter *.pext2 | Rename-Item -NewName ("${{ steps.release.outputs.tag_name }}" + ".pext2")

      - name: Upload Release Artifact
        if: ${{ steps.release.outputs.release_created }}
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: gh release upload ${{ steps.release.outputs.tag_name }} .\${{ steps.release.outputs.tag_name }}.pext2

      # The manifest steps key off repository state, not release_created. release-please reports
      # release_created only on the run that creates the release, so a manifest update that failed
      # after the release was published could not be retried: re-running the job skipped these
      # steps and went green while Playnite still could not see the new version. Now any later
      # main run, including a re-run, finishes the job once the release's .pext2 is published.
      # A re-run checks out its original commit, which main may have moved past, so the decision
      # and the update both work from current main: the release version, installer_manifest.yaml,
      # and the CHANGELOG.md highlights the update script reads. Gated on main, so these steps
      # stay inert on playnite11 until it becomes main.
      - name: Check Installer Manifest
        id: manifest
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "Fetching main failed" }
          git checkout --force -B manifest-update FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw "Checking out main failed" }
          $version = (Get-Content -Raw .release-please-manifest.json | ConvertFrom-Json).'.'
          $tag = "GsPlugin-v$version"
          if (Select-String -Path installer_manifest.yaml -Pattern "^\s*- Version: $([regex]::Escape($version))\s*$" -Quiet) {
            Write-Host "installer_manifest.yaml already lists $version"
            exit 0
          }
          $lookup = @(gh release view $tag --json assets --jq '.assets[].name' 2>&1 | ForEach-Object { "$_" })
          if ($LASTEXITCODE -ne 0) {
            if ($lookup -match 'release not found') {
              Write-Host "$tag has no release yet, leaving installer_manifest.yaml alone"
              exit 0
            }
            throw "Looking up release ${tag} failed: $($lookup -join ' ')"
          }
          if ($lookup -notcontains "$tag.pext2") {
            Write-Host "$tag has no published .pext2, leaving installer_manifest.yaml alone"
            exit 0
          }
          Write-Host "installer_manifest.yaml is missing released version $version"
          "needed=true" >> $Env:GITHUB_OUTPUT
          "version=$version" >> $Env:GITHUB_OUTPUT
          "tag=$tag" >> $Env:GITHUB_OUTPUT

      - name: Update Installer Manifest
        if: steps.manifest.outputs.needed == 'true'
        run: |
          Write-Host "Updating installer manifest for version ${{ steps.manifest.outputs.version }}"
          powershell -ExecutionPolicy Bypass -File "$Env:GITHUB_WORKSPACE\scripts\update-installer-manifest.ps1" -Version "${{ steps.manifest.outputs.version }}" -TagName "${{ steps.manifest.outputs.tag }}"

      # A merge that lands on main while this job builds would reject a plain push, so rebase onto
      # it and retry. A rebase conflict still fails the job. Both steps branch on $LASTEXITCODE,
      # so native command failures must not throw.
      - name: Commit and Push Manifest Changes
        if: steps.manifest.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add installer_manifest.yaml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore: update installer_manifest.yaml for ${{ steps.manifest.outputs.tag }}"
            if ($LASTEXITCODE -ne 0) { throw "Committing installer_manifest.yaml failed" }
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            git push origin HEAD:main
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -eq 3) { break }
            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) { throw "Rebasing the manifest commit onto main failed" }
          }
          throw "Could not push installer_manifest.yaml after 3 attempts"
